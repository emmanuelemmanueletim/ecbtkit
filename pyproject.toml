[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecbtkit"
version = "0.1.0"
description = "Production-ready Python framework for CBT & online examination APIs — independent, secure, multi-database"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Emmanuel Emmanuel Etim", email = "emmanuel224etim089@gmail.com"}]
keywords = ["cbt", "examination", "assessment", "auth", "api-framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9"]
mysql = ["pymysql>=1.1.0", "cryptography>=41.0.0"]
mongo = ["pymongo>=4.6.0"]
redis = ["redis>=5.0.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "httpx>=0.26.0"]
all = ["ecbtkit[postgres,mysql,mongo,redis,dev]"]

[project.scripts]
ecbt = "ecbtkit.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecbtkit*"]

[project.urls]
Homepage = "https://github.com/emmanuelemmanueletim/ecbtkit"
Documentation = "https://github.com/emmanuelemmanueletim/ecbtkit#readme"
Repository = "https://github.com/emmanuelemmanueletim/ecbtkit"
Issues = "https://github.com/emmanuelemmanueletim/ecbtkit/issues"
